name: Build 7xTubeDash APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release for direct car-browser download'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename Output APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/7xTubeDash-arm64.apk
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7xTubeDash-arm64
          path: dist/7xTubeDash-arm64.apk

      - name: Publish Direct-Download GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          name: "7xTubeDash ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name || 'latest' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/7xTubeDash-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
